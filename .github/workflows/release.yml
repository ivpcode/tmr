name: release

# La release parte quando il file VERSION cambia su main (il proxy git degli
# ambienti remoti non consente il push diretto dei tag): il workflow crea il
# tag v<VERSION> e pubblica la release con i pacchetti .deb.
# Restano disponibili anche il push manuale di un tag v* e il dispatch manuale.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da rilasciare, senza prefisso v (es. 0.1.0). Crea anche il tag."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Determine version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="$(tr -d ' \n' < VERSION)"
          fi
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "versione non valida: '$V'" >&2; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test -race ./...

      - name: Build .deb packages
        run: |
          chmod +x scripts/build-deb.sh
          scripts/build-deb.sh "${{ steps.v.outputs.version }}" amd64
          scripts/build-deb.sh "${{ steps.v.outputs.version }}" arm64
          cd dist && sha256sum *.deb > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: |
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
