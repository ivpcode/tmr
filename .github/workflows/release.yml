name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da rilasciare, senza prefisso v (es. 0.1.0). Crea anche il tag."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Determine version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: go test -race ./...

      - name: Build .deb packages
        run: |
          chmod +x scripts/build-deb.sh
          scripts/build-deb.sh "${{ steps.v.outputs.version }}" amd64
          scripts/build-deb.sh "${{ steps.v.outputs.version }}" arm64
          cd dist && sha256sum *.deb > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: |
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
